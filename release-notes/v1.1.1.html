<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AsoPeak 1.1.1 — What's New</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #0f172a;
    --text-muted: #64748b;
    --link: rgb(54, 91, 219);
    --border: rgba(15, 23, 42, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1020;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --link: rgb(140, 168, 255);
      --border: rgba(255, 255, 255, 0.08);
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 460px;
    margin: 0 auto;
    padding: 22px 24px 28px;
  }
  h1 {
    margin: 0 0 6px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .meta {
    margin: 0 0 18px;
    color: var(--text-muted);
    font-size: 12px;
  }
  .note-section {
    --section-badge-bg: var(--light-badge-bg);
    --section-badge-text: var(--light-badge-text);
    --section-badge-border: var(--light-badge-border);
    --section-accent: var(--light-accent);
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .note-section + .note-section {
    margin-top: 16px;
  }
  .section-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    background: var(--section-badge-bg);
    color: var(--section-badge-text);
    border: 1px solid var(--section-badge-border);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  ul.changes {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  ul.changes li {
    padding: 12px 0 12px 22px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  ul.changes li::before {
    content: "";
    position: absolute;
    left: 4px;
    top: 19px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--section-accent);
  }
  @media (prefers-color-scheme: dark) {
    .note-section {
      --section-badge-bg: var(--dark-badge-bg);
      --section-badge-text: var(--dark-badge-text);
      --section-badge-border: var(--dark-badge-border);
      --section-accent: var(--light-accent);
    }
  }
  footer {
    margin-top: 18px;
    text-align: right;
  }
  footer a {
    color: var(--link);
    font-size: 12px;
    text-decoration: none;
    font-weight: 500;
  }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <h1>What's new in 1.1.1</h1>
  <p class="meta">May 20, 2026</p>
  <section class="note-section" style="--light-badge-bg: #ffe4e6; --light-badge-text: #9f1239; --light-badge-border: #fecdd3; --light-accent: #f43f5e; --dark-badge-bg: rgba(244,63,94,0.18); --dark-badge-text: #fda4af; --dark-badge-border: rgba(244,63,94,0.30);">
    <div class="section-badge">Fix</div>
    <ul class="changes">
      <li>Fixed an issue where Review Insights could fail to generate a report.</li>
      <li>Fixed Codex CLI not connecting to AsoPeak&#x27;s MCP server.</li>
    </ul>
  </section>
  <footer><a href="https://asopeak.app/changelog">View all releases →</a></footer>
</main>
</body>
</html>
